<header class="topbar">
  <a routerLink="/leaderboard" class="brand">📊 {{ title() }}</a>
  <nav class="nav">
    @if (auth.isTeacher()) {
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Kursevi</a>
      <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
      <a routerLink="/upravljanje" routerLinkActive="active">Upravljanje</a>
      <button class="linkbtn" (click)="logout()">Odjava</button>
    } @else {
      <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
      <a routerLink="/login" routerLinkActive="active">Prijava nastavnika</a>
    }
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>
